version: "3.8"

services:
  ndmi-app:
    build: .
    container_name: ndmi_streamlit
    ports:
      - "8501:8501"
    volumes:
      - .:/app
      - ./data:/app/data
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_BROWSER_SERVER_ADDRESS=localhost
      - STREAMLIT_BROWSER_SERVER_PORT=8501